name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: unzip -o titonox-ai-fixed.zip -d .

    - name: Remove corrupt Gradle wrapper
      run: rm -f titonox-ai/gradle/wrapper/gradle-wrapper.jar titonox-ai/gradle/wrapper/gradle-wrapper.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1

    - name: Build with Gradle
      working-directory: titonox-ai
      run: gradle assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: titonox-ai-debug-apk
        path: titonox-ai/app/build/outputs/apk/debug/app-debug.apk
